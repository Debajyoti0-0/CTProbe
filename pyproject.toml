[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctprobe"
version = "1.0.0"
description = "Certificate Transparency subdomain enumeration and HTTP/S reconnaissance tool for authorized security assessments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Debajyoti0-0" }]
keywords = ["security", "certificate-transparency", "subdomain-enumeration", "reconnaissance", "http", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
]

# Core runtime dependencies. aiohttp powers the async live-testing engine;
# requests[socks] provides the fail-closed SOCKS/Tor path; tldextract gives a
# public-suffix-aware apex. These map to Debian packages in debian/control.
dependencies = [
    "requests[socks]>=2.28.0",
    "urllib3>=1.26.0",
    "tldextract>=5.1.0",
    "aiohttp>=3.8,<4",
]

[project.optional-dependencies]
# Each extra enables one optional feature; the tool degrades gracefully without it.
http2 = ["httpx[http2]>=0.24.0"]   # explicit --http-version 2
xlsx = ["openpyxl>=3.10.0"]        # --output xlsx
rich = ["rich>=13.0.0"]            # enhanced terminal UI
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-mock>=3.10.0"]

[project.urls]
Homepage = "https://github.com/Debajyoti0-0/ctprobe"

[project.scripts]
ctprobe = "ctprobe.main:main"

[tool.setuptools]
packages = ["ctprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
